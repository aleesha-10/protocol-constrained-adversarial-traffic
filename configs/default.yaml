seeds: [0, 1, 2]          # run every experiment on all seeds, report mean +/- std
data:
  primary: CIC-IoT-2023
  cross_dataset: UNSW-NB15
  classes: [Benign, DDoS-UDP_Flood, DoS-TCP_Flood, Recon-PortScan]
  heldout_class: DictionaryBruteForce
  max_flows_per_class: 5000
  split: {train: 0.70, val: 0.15, test: 0.15}
image:
  packets: 16
  bytes: 64
  channels: 3
attack:
  eps_bytes: [1, 4, 16, 32]
  steps: 25
  step_size: 2
training:
  epochs: 20
  batch_size: 128
  lr: 0.001
